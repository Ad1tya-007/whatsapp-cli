name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high/critical vulnerabilities
        # Informational for transitive noise; still fail on high/critical in direct tree
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Typecheck / build
        run: npm run build

      - name: Verify publishable package contents
        run: |
          npm pack --dry-run
          test -f dist/index.js
          test -f dist/client.js
          test -f dist/sendMessage.js

      - name: CLI smoke check
        run: |
          node dist/index.js --help
          node dist/index.js --version
